name: Publish

# Push a tag like v1.2.3 to build every platform and publish a GitHub Release
# with the zips attached. The release text comes from
# docs/release-notes/<tag>.md when that file exists.
#
# "Run workflow" on the Actions tab builds the same zips as downloadable
# workflow artifacts. Fill in "tag" there to also create that tag on the
# commit being built and publish the release, without pushing a tag first.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.2.3 (leave empty to only build artifacts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.build.os }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        build:
        - { os: macos-latest,   ostype: darwin, arch: x64,    icon: src/img/icon.icns }
        - { os: macos-latest,   ostype: darwin, arch: arm64,  icon: src/img/icon.icns }
        - { os: ubuntu-latest,  ostype: linux,  arch: x64,    icon: src/img/icon.png }
        - { os: ubuntu-latest,  ostype: linux,  arch: arm64,  icon: src/img/icon.png }
        - { os: ubuntu-latest,  ostype: linux,  arch: armv7l, icon: src/img/icon.png }
        - { os: windows-latest, ostype: win32,  arch: ia32,   icon: src/img/icon.ico }
        - { os: windows-latest, ostype: win32,  arch: x64,    icon: src/img/icon.ico }
        - { os: windows-latest, ostype: win32,  arch: arm64,  icon: src/img/icon.ico }

    name: Build (${{ matrix.build.ostype }} ${{ matrix.build.arch }})

    env:
      NAME: BloodHound-${{ matrix.build.ostype }}-${{ matrix.build.arch }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 16
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Test
      run: npm test

    - name: Build
      run: |
        npm run compile
        npm run package -- --platform=${{ matrix.build.ostype }} --arch=${{ matrix.build.arch }} --icon=${{ matrix.build.icon }}

    # Packaging invalidates Electron's signature and Apple Silicon refuses to run
    # unsigned code, so apply a free ad-hoc signature (no Apple developer account).
    - name: Ad-hoc sign (macOS)
      if: matrix.build.ostype == 'darwin'
      run: codesign --force --deep --sign - "$NAME/BloodHound.app"

    # ditto and zip -y keep the symlinks inside the app bundles; 7z would flatten them.
    - name: Zip (macOS)
      if: matrix.build.ostype == 'darwin'
      run: ditto -c -k --sequesterRsrc --keepParent "$NAME" "$NAME.zip"

    - name: Zip (Linux)
      if: matrix.build.ostype == 'linux'
      run: zip -qry "$NAME.zip" "$NAME"

    - name: Zip (Windows)
      if: matrix.build.ostype == 'win32'
      run: 7z a -tzip -mx9 "$NAME.zip" "$NAME"

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.NAME }}
        path: ${{ env.NAME }}.zip

  # One job publishes the release after every platform has built, so the tag
  # and release are created once, and only when all builds succeeded.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v4

    - name: Download builds
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Release notes
      id: notes
      run: |
        if [ -f "docs/release-notes/$TAG.md" ]; then
          echo "path=docs/release-notes/$TAG.md" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        target_commitish: ${{ github.sha }}
        body_path: ${{ steps.notes.outputs.path }}
        files: dist/*/*.zip
