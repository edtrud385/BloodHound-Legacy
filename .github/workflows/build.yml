name: Build

# Quick check on every push: tests plus a webpack compile. Release binaries for
# every platform come from publish.yml when a v*.*.* tag is pushed.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 16
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Test
      run: npm test

    - name: Compile
      run: npm run compile
